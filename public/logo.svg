<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80" fill="none">
  <!-- Stylized Geometric Wordmark for 신문과방송 -->
  <g fill="#111827" stroke="#111827">
    <!-- 1. '신' -->
    <!-- ㅅ (chevron) -->
    <path d="M 18 53 L 31 32 L 44 53" fill="none" stroke-width="6.5" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- ㅣ (vertical) -->
    <rect x="47" y="32" width="6.5" height="30" rx="0.5" />
    <!-- ㄴ (bottom) -->
    <path d="M 22 66 L 22 75 L 49 75" fill="none" stroke-width="6.5" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- 2. '문' -->
    <!-- ㅁ (square) -->
    <rect x="58" y="32" width="28" height="21" fill="none" stroke-width="6" rx="0.5" />
    <!-- ㅜ (cross) -->
    <rect x="58" y="58" width="28" height="5.5" rx="0.5" />
    <rect x="70" y="62" width="5.5" height="7" rx="0.5" />
    <!-- ㄴ (bottom) -->
    <path d="M 61 71 L 61 77 L 85 77" fill="none" stroke-width="5.5" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- 3. '과' -->
    <!-- ㄱ (top left) -->
    <path d="M 94 34 L 110 34 L 110 46" fill="none" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- ㅗ (middle bottom) -->
    <rect x="100" y="50" width="6" height="10" rx="0.5" />
    <rect x="94" y="60" width="20" height="6" rx="0.5" />
    <!-- ㅏ (right vertical + horizontal) -->
    <rect x="119" y="32" width="6.5" height="42" rx="0.5" />
    <rect x="125" y="47" width="8" height="6" rx="0.5" />

    <!-- 4. '방' -->
    <!-- ㅂ (square container) -->
    <path d="M 139 33 L 139 56 L 157 56 L 157 33 M 139 44 L 157 44" fill="none" stroke-width="5.5" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- ㅏ (right vertical + tick) -->
    <rect x="162" y="32" width="6" height="30" rx="0.5" />
    <rect x="168" y="43" width="7" height="5.5" rx="0.5" />
    <!-- ㅇ (bottom circle) -->
    <circle cx="148" cy="67" r="8" fill="none" stroke-width="5.5" />

    <!-- 5. '송' -->
    <!-- ㅅ (chevron roof) -->
    <path d="M 175 32 L 187 14 L 199 32" fill="none" stroke-width="6.5" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- ㅗ (horizontal line) -->
    <rect x="175" y="40" width="24" height="6" rx="0.5" />
    <!-- ㅇ (bottom circle) -->
    <circle cx="187" cy="63" r="10" fill="none" stroke-width="6" />
  </g>
</svg>
